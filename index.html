    <title>Konva</title>

    <!--
      Sets data-theme on <html> before the CSS/React bundle loads.
      Without this, the page briefly paints in light mode (the default
      in tokens.css) even when the visitor has dark mode saved, then
      flips once React mounts. Keep this logic in sync with
      src/lib/theme.js if the storage key or fallback ever changes.
    -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem('konva-theme') || 'system';
          var dark = p === 'dark' || (p === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
